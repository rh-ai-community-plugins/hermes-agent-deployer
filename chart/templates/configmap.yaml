apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermes-agent-deployer.fullname" . }}-config
  labels:
    {{- include "hermes-agent-deployer.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "hermesImage": {{ .Values.instanceDefaults.hermesImage | quote }},
      "oauthProxy": {
        "enabled": {{ .Values.instanceDefaults.oauthProxy.enabled }},
        "image": {{ .Values.instanceDefaults.oauthProxy.image | quote }}
      },
      "pvc": {
        "size": {{ .Values.instanceDefaults.pvc.size | quote }}
      },
      "resources": {{- .Values.instanceDefaults.resources | toJson | nindent 8 }}
    }
