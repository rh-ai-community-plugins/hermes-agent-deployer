{{- if .Values.openshell.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermes-agent-deployer.fullname" . }}-openshell-policy
  labels:
    {{- include "hermes-agent-deployer.labels" . | nindent 4 }}
data:
  policy-standard.yaml: |
    # Standard sandbox policy for Hermes agent instances.
    # Allows: LiteLLM inference, PyPI (skill installs), GitHub (read-only),
    #         NousResearch (model catalog), RHOAI MLflow (tracing).
    # Blocks: direct AI APIs, arbitrary web access, GitHub write operations.
    version: 1

    filesystem_policy:
      include_workdir: true
      read_only:
        - /usr
        - /lib
        - /lib64
        - /bin
        - /sbin
        - /proc
        - /dev/urandom
        - /etc
        - /app
        - /opt
        - /var/log
      read_write:
        - /sandbox
        - /workspace
        - /tmp
        - /home/hermes
        - /dev/null
        - /dev/zero
        - /dev/shm

    landlock:
      compatibility: best_effort

    process:
      run_as_user: sandbox
      run_as_group: sandbox

    network_policies:

      pypi:
        name: "PyPI"
        endpoints:
          - host: pypi.org
            port: 443
            protocol: rest
            enforcement: enforce
            access: full
          - host: files.pythonhosted.org
            port: 443
            enforcement: enforce
            access: full
        binaries:
          - { path: /usr/bin/curl }
          - { path: /usr/bin/python3 }
          - { path: /usr/bin/python3.12 }

      github_readonly:
        name: "GitHub (read-only)"
        endpoints:
          - host: github.com
            port: 443
            protocol: rest
            enforcement: enforce
            access: read-only
          - host: api.github.com
            port: 443
            protocol: rest
            enforcement: enforce
            access: read-only
          - host: "*.githubusercontent.com"
            port: 443
            enforcement: enforce
            access: read-only
        binaries:
          - { path: /usr/bin/curl }
          - { path: /usr/bin/git }
          - { path: /usr/bin/python3 }

      nousresearch:
        name: "NousResearch (model catalog)"
        endpoints:
          - host: hermes-agent.nousresearch.com
            port: 443
            protocol: rest
            enforcement: enforce
            access: read-only
          - host: nousresearch.com
            port: 443
            protocol: rest
            enforcement: enforce
            access: read-only
        binaries:
          - { path: /usr/bin/curl }
          - { path: /usr/bin/python3 }

      {{- if .Values.openshell.ocpAppsDomain }}
      openshift_oauth:
        name: "OpenShift OAuth"
        endpoints:
          - host: "oauth-openshift.{{ .Values.openshell.ocpAppsDomain }}"
            port: 443
            protocol: rest
            enforcement: enforce
            access: full
        binaries:
          - { path: /usr/bin/curl }

      mlflow_rhoai:
        name: "RHOAI MLflow"
        endpoints:
          - host: "mlflow-redhat-ods-applications.{{ .Values.openshell.ocpAppsDomain }}"
            port: 443
            protocol: rest
            enforcement: enforce
            access: full
        binaries:
          - { path: /usr/bin/curl }
          - { path: /usr/bin/python3 }
          - { path: /usr/bin/python3.12 }
      {{- end }}
{{- end }}
