image:
  repository: quay.io/rh-ai-community-plugins/hermes-agent-deployer
  tag: latest
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

route:
  enabled: true

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

instanceDefaults:
  hermesImage: quay.io/rh-ai-community-plugins/hermes-sandbox:0.1.0
  oauthProxy:
    enabled: true
    image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.17
  pvc:
    size: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
