nameOverride: "hermes-agent-deployer"
fullnameOverride: "hermes-agent-deployer"

image:
  repository: quay.io/rh-ai-community-plugins/hermes-agent-deployer
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

route:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

# Instance defaults served as /config.json to the frontend
instanceDefaults:
  hermesImage: quay.io/rh-ai-community-plugins/hermes-sandbox:0.1.0
  oauthProxy:
    enabled: true
    image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.17
  pvc:
    size: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# OpenShell sandbox security (optional)
# Requires: OpenShell gateway deployed, Agent Sandbox CRDs installed,
# privileged SCC granted to openshell-sandbox SA
openshell:
  enabled: false
  gateway:
    namespace: openshell
  networkPolicy:
    tier: standard
  # OCP apps domain for policy template rendering (e.g., apps.cluster.example.com)
  ocpAppsDomain: ""

# BFF service
bff:
  enabled: true
  image:
    repository: quay.io/rh-ai-community-plugins/hermes-agent-deployer-bff
    tag: ""
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
