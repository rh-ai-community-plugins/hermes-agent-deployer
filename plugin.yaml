# --- Plugin identity (required) ---
name: hermes-agent-deployer
displayName: Hermes Agent Deployer
description: Deploy and manage Hermes Agent instances on OpenShift via RHOAI Dashboard
version: 0.1.0

# --- Maintainer (required) ---
maintainer:
  name: Erwan Granger
  github: erwangranger

# --- RHOAI compatibility (required) ---
rhoai_compatibility:
  min_version: "3.4.0"
  tested_versions: ["3.4.0"]

# --- Deployment (required) ---
deployment_model: per-project

image:
  repository: quay.io/rh-ai-community-plugins/hermes-agent-deployer
  tag: "0.1.0"

bff_image:
  repository: quay.io/rh-ai-community-plugins/hermes-agent-deployer-bff
  tag: "0.1.0"

# --- Installation (required) ---
install:
  method: assisted
  helm:
    chart_path: chart/
    registry: oci://quay.io/rh-ai-community-plugins/hermes-agent-deployer-chart
  prerequisites:
    - Access to a namespace with permission to create Deployments, Services, Routes, Secrets, PVCs, and ServiceAccounts
  instructions: https://github.com/rh-ai-community-plugins/hermes-agent-deployer/blob/main/docs/deployment

# --- Dashboard integration (required) ---
remote:
  type: module-federation
  spec:
    name: hermesAgentDeployer
    scope: hermesAgentDeployer
    remoteEntry: https://<your-openshift-route>/remoteEntry.js
    paths:
      - type: route
        path: /hermes-agent-deployer
        extensions:
          - hermesAgentDeployer/extensions
      - type: icon
        path: hermesAgentDeployer/Icon

# --- RBAC (required) ---
rbac:
  required_roles: []
  cluster_roles: false

# --- Support (optional) ---
support:
  repo: https://github.com/rh-ai-community-plugins/hermes-agent-deployer
  docs: https://github.com/rh-ai-community-plugins/hermes-agent-deployer/tree/main/docs
  issues: https://github.com/rh-ai-community-plugins/hermes-agent-deployer/issues
